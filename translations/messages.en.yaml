batch.privacy_retention: "You can delete your CV draft and individual requests in your account. Until then they are kept for processing and access to your history. Deleting a request removes its PDF, text and results from the live database and the operator’s folder at the next sync. Backups follow a separate retention cycle; contact the controller to arrange complete deletion."
