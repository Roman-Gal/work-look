batch.privacy_purpose: "We use your PDF, text, contact details and preferences for the job search you request, CV preparation and result notification. Processing is necessary to provide the requested service (GDPR Article 6(1)(b)). The checkbox acknowledges this notice and does not grant marketing consent."
