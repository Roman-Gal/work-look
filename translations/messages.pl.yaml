batch.mail_subject: "WorkLook: Twój wynik jest gotowy"
batch.mail_body: "Wynik Twojego zlecenia jest już dostępny w WorkLook. Zaloguj się, aby przejrzeć oferty i przygotowane CV."
batch.review_help: "AI może się mylić. Przed aplikowaniem sprawdź wymagania ofert i wszystkie informacje w przygotowanym CV."
batch.fit: "Dlaczego pasuje"
batch.gaps: "Co wymaga sprawdzenia"
batch.checked: "Data weryfikacji"
batch.vacancy: "Otwórz ofertę"
batch.cv: "Pobierz CV w PDF"
batch.remove: "Usuń zlecenie i wynik"
batch.remove_help: "Usuwane są dane zlecenia, kopia PDF i wynik. Główna wersja robocza CV i potwierdzony profil pozostają. Lokalna kopia operatora zostanie usunięta podczas następnej synchronizacji."
batch.privacy: "Jak przetwarzamy CV"
batch.privacy_ack: "Zapoznałem/am się z informacją o przetwarzaniu CV w celu wyszukiwania ofert i przygotowania CV, w tym przez operatora i OpenAI."
batch.privacy_required: "Przed przesłaniem przeczytaj informację o przetwarzaniu CV i zaznacz potwierdzenie."
batch.privacy_identity: "Administrator danych: Roman Halaiko. Kontakt: rh-additional@rh-additional.usermd.net."
batch.privacy_purpose: "PDF, tekst, dane kontaktowe i preferencje służą zleconemu wyszukiwaniu pracy, przygotowaniu CV i powiadomieniu o wyniku. Podstawą jest wykonanie zamówionej usługi (art. 6 ust. 1 lit. b RODO). Potwierdzenie dotyczy zapoznania się z informacją, nie zgody marketingowej."
batch.privacy_recipients: "Dane są przechowywane w prywatnej bazie MyDevil i pobierane na komputer operatora. Dane potrzebne do zadania są przekazywane OpenAI przez Codex; przetwarzanie nie jest wyłącznie lokalne. Obowiązują warunki i ustawienia przetwarzania OpenAI; przetwarzanie może odbywać się poza EOG. Nie wysyłamy automatycznie CV pracodawcom."
batch.privacy_retention: "Wersję roboczą CV i każde zlecenie możesz usunąć na swoim koncie. Do tego czasu służą realizacji i dostępowi do historii. Usunięcie zlecenia usuwa jego PDF, tekst i wynik z bazy roboczej, a przy kolejnej synchronizacji z folderu operatora. Kopie zapasowe mają osobny cykl przechowywania; w sprawie pełnego usunięcia skontaktuj się z administratorem."
batch.privacy_rights: "Możesz wystąpić o dostęp, sprostowanie, usunięcie, ograniczenie przetwarzania i przenoszenie danych w przypadkach przewidzianych RODO. Możesz też złożyć skargę do UODO lub innego właściwego organu ochrony danych."
batch.privacy_sensitive: "Przesyłaj wyłącznie własne CV. Nie dodawaj numeru PESEL, skanów dokumentów, danych medycznych ani innych wrażliwych danych niepotrzebnych do szukania pracy."
