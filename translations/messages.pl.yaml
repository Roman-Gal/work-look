batch.title: "Szukanie pracy z WorkLook"
batch.intro: "Prześlij CV, zapisz preferencje i zleć wyszukiwanie."
batch.new: "Twoje zlecenie wyszukiwania"
batch.wait: "Ze względu na limity AI przetwarzamy zlecenia partiami. Orientacyjny czas to do 24 godzin; duża kolejka może wydłużyć oczekiwanie. Wynik pojawi się na Twoim koncie, a link wyślemy na adres rejestracji."
batch.submit: "Zleć wyszukiwanie"
batch.setup: "Prześlij CV z potwierdzeniem informacji o przetwarzaniu danych i zapisz oczekiwania. Starsze CV trzeba przesłać ponownie."
batch.how: "Od CV do wyniku"
batch.how_body: "Dobieramy aktualne oferty, wyjaśniamy dopasowanie i przygotowujemy CV na podstawie Twoich danych. Sprawdź treść przed aplikowaniem."
