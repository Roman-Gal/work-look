batch.remove_help: "Видаляються дані цього запиту, копія PDF та результат. Основна чернетка CV і підтверджений профіль залишаються. Локальна копія оператора видаляється під час наступної синхронізації."
batch.privacy: "Як ми обробляємо CV"
batch.privacy_ack: "Я ознайомився з інформацією про обробку CV для пошуку вакансій і підготовки резюме, включно з обробкою оператором та OpenAI."
batch.privacy_required: "Перед завантаженням ознайомтеся з інформацією про обробку CV та поставте позначку."
batch.privacy_identity: "Адміністратор даних: Roman Halaiko. Контакт: rh-additional@rh-additional.usermd.net."
batch.privacy_purpose: "Використовуємо наданий PDF, текст, контактні дані й побажання для запитаного вами пошуку роботи, підготовки CV та повідомлення про готовність. Обробка необхідна для надання запитаної послуги (ст. 6(1)(b) GDPR). Позначка підтверджує ознайомлення з цією інформацією; маркетингової згоди вона не надає."
batch.privacy_recipients: "Дані зберігаються в приватній БД на MyDevil та передаються на комп’ютер оператора для обробки. Дані, потрібні для завдання, передаються OpenAI через Codex; це не повністю локальна обробка. Застосовуються умови та налаштування обробки даних OpenAI, можливе опрацювання поза ЄЕЗ. Роботодавцям CV автоматично не надсилаємо."
batch.privacy_retention: "Чернетку CV та кожен запит можна видалити у своєму акаунті. До видалення вони зберігаються для обробки та доступу до історії. Видалення запиту прибирає його PDF, текст і результат із робочої БД та з локальної папки оператора під час наступної синхронізації. Резервні копії видаляються за окремим циклом зберігання; щоб узгодити повне видалення, зверніться до адміністратора."
batch.privacy_rights: "Можна звернутися щодо доступу, виправлення, видалення, обмеження обробки та перенесення даних у передбачених GDPR випадках. Також можна подати скаргу до UODO або іншого компетентного органу захисту даних."
batch.privacy_sensitive: "Завантажуйте лише своє CV. Не додавайте PESEL, скани документів, медичні та інші чутливі дані, які не потрібні для пошуку роботи."
