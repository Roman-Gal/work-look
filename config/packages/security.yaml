security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    providers:
        app_users:
            entity: { class: App\Entity\User, property: email }
    firewalls:
        dev:
            pattern: ^/(assets|build)/
            security: false
        local_worker:
            pattern: ^/internal/local-work(?:/|$)
            security: false
        main:
            lazy: true
            provider: app_users
            user_checker: App\Security\VerifiedUserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            login_throttling: { max_attempts: 5, interval: '1 minute' }
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
    access_control:
        - { path: ^/privacy/cv$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/(telegram/webhook|translator/telegram/webhook)$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/language/(uk|pl|en)$, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/(register|verify-email)$, roles: PUBLIC_ACCESS }
        - { path: ^/healthz$, roles: PUBLIC_ACCESS }
        - { path: ^/admin(?:/|$), roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
