framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy: { max_retries: 0 }
            failed: 'doctrine://default?queue_name=failed&auto_setup=1'
        routing:
            App\Message\StartAgentRun: async
when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
